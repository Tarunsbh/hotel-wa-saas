server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Enable dynamic DNS resolution (required for variable-based proxy_pass)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # React SPA — all non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → NestJS backend
    location /api/ {
        set $backend_host "${BACKEND_HOST}";
        proxy_pass http://$backend_host:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Socket.IO WebSocket proxy
    location /socket.io/ {
        set $backend_host "${BACKEND_HOST}";
        proxy_pass http://$backend_host:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
}
